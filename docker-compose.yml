# Hue Solver: static files served by nginx. Start with `docker compose up -d`, open http://localhost:8080
# Only the app files are mounted; tests, docs and .git stay unreachable.
services:
  huesolver:
    image: nginx:alpine
    container_name: huesolver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./icons:/usr/share/nginx/html/icons:ro
